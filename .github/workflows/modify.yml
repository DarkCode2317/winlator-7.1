name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Winlator 1.11
        uses: actions/checkout@v4
        with:
        repository: DarkCode2317/winlator-app
        path: winlator-app

      - name: Copy gradle
        run: |
          copy -r winlator/gradle .
          copy winlator/gradlew .
          copy winlator/settings.gradle .

      - name: Commit
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"
          git add .
          git commit -m "Modify repo"
          git push
        